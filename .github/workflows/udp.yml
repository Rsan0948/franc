name: Franc native UDP DNS exchange (e1000 + IPv4 + UDP)
on:
  push:
    branches: [stage4-roadmap-foundations]
    paths:
      - 'stage4/net.frac'
      - 'stage4/udp.frac'
      - 'stage4/ip.frac'
      - 'stage4/runtime.S'
      - 'stage4/aot.frac'
      - 'stage4/boot.S'
      - 'stage4/pci.frac'
      - 'stage4/qemu_net.py'
      - 'stage4/bootstrap_seed.S'
      - 'stage4/app_sources.list'
      - 'stage4/pack_native.sh'
      - 'franctxt/seed.lock.franctxt'
      - 'franctxt/build.py'
      - 'franctxt/memory.franctxt'
      - '.github/workflows/network.yml'
  pull_request:
    paths:
      - 'stage4/net.frac'
      - 'stage4/udp.frac'
      - 'stage4/ip.frac'
      - 'stage4/runtime.S'
      - 'stage4/aot.frac'
      - 'stage4/boot.S'
      - 'stage4/pci.frac'
      - 'stage4/qemu_net.py'
      - 'stage4/bootstrap_seed.S'
      - '.github/workflows/network.yml'
permissions:
  contents: read
jobs:
  ethernet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale bootstrap or overlapping DMA reservations
        run: python3 -m franctxt.build preflight
      - name: Verify native PCI MMIO ABI, BAR0 and BIOS page-table contract before QEMU
        run: python3 -m unittest discover -s franctxt/tests -p 'test_mmio_contract.py' -v
      - name: Install QEMU software emulator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86
      - name: Build native Franc kernel plus exact app source bundle
        run: make -f stage4/Makefile.native native-seed
      - name: Verify exact packed Franctxt kernel and e1000 source identities
        run: python3 -m franctxt.build verify-image --image stage4/native_seed.img --kernel stage4/native_seed.bin
      - name: QEMU DNS UDP request/reply, native validation and independent packet capture
        run: FRANC_TEST_UDP=1 python3 stage4/qemu_net.py stage4/native_seed.img
      - name: Record tested network image and seed identity
        run: python3 -m franctxt.build record --image stage4/native_seed.img --kernel stage4/native_seed.bin --passed network --output stage4/udp-tested.franctxt
      - uses: actions/upload-artifact@v4
        with:
          name: franctxt-udp-tested-build
          if-no-files-found: error
          path: stage4/udp-tested.franctxt
