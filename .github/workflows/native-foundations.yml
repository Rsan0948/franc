name: FrancOS native foundations

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'kernel/**'
      - 'compiler/**'
      - 'drivers/storage/**'
      - 'tests/foundations/**'
      - 'tests/asm_speed/**'
      - 'tests/toolchain/**'
      - 'lib/toolchain.frac'
      - 'build/toolchain*'
      - 'franctxt/**'
      - '.github/workflows/native-foundations.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'kernel/**'
      - 'compiler/**'
      - 'drivers/storage/**'
      - 'tests/foundations/**'
      - 'tests/asm_speed/**'
      - 'tests/toolchain/**'
      - 'lib/toolchain.frac'
      - 'build/toolchain*'
      - 'franctxt/**'
      - '.github/workflows/native-foundations.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: python3 -m pip install --quiet cryptography
      - name: Every contract test in one place
        run: |
          # test_native_disk.py is a script that needs a built image, so franctxt.yml runs it.
          for test in franctxt/tests/test_*.py; do
            [ "$test" = franctxt/tests/test_native_disk.py ] && continue
            python3 -m unittest discover -s franctxt/tests -p "$(basename "$test")"
          done
  foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86
      - name: Runtime limits, capture and disk rules hold in the guest
        run: |
          make os
          bash tests/foundations/run.sh build/out/francos-bios.img
      - name: The toolchain archive loads and refuses damaged disks
        run: bash tests/toolchain/run.sh build/out/francos-bios.img
      - name: The Franc assembler matches GNU as on every kernel input
        run: bash tests/asm_speed/run.sh build/out/francos-bios.img
