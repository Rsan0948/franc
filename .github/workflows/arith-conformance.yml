name: Franc arithmetic conformance

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'frac.c'
      - 'tests/arith/**'
      - 'build/**'
      - '.github/workflows/arith-conformance.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'frac.c'
      - 'tests/arith/**'
      - 'build/**'
      - '.github/workflows/arith-conformance.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86
      - name: Native runtime matches the table inside FrancOS
        run: |
          make os
          bash tests/arith/run_native.sh build/out/francos-bios.img
      - name: Hosted interpreter matches the same table
        run: |
          make frac
          bash tests/arith/run_hosted.sh ./frac
