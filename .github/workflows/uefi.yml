name: Franc x64 UEFI boot — C loader, Franc kernel
on:
  push:
    branches: [stage4-roadmap-foundations]
    paths:
      - 'stage4/uefi/**'
      - 'stage4/bootstrap_seed.S'
      - 'stage4/runtime.S'
      - 'franctxt/seed.lock.franctxt'
      - 'franctxt/build.py'
      - 'franctxt/memory.franctxt'
      - 'franctxt/install_native.sh'
      - 'stage4/pack_native.sh'
      - '.github/workflows/uefi.yml'
  pull_request:
    paths:
      - 'stage4/uefi/**'
      - 'stage4/bootstrap_seed.S'
      - 'stage4/runtime.S'
      - 'franctxt/seed.lock.franctxt'
      - 'franctxt/build.py'
      - 'franctxt/memory.franctxt'
      - 'franctxt/install_native.sh'
      - '.github/workflows/uefi.yml'
permissions:
  contents: read
jobs:
  ovmf-cold-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Franctxt seed and application compatibility preflight
        run: python3 -m franctxt.build preflight
      - name: Install QEMU, OVMF, and mtools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 ovmf mtools lld
      - name: Verify clang/lld-link for UEFI PE32+
        run: |
          clang --version | head -1
          command -v lld-link
      - name: Assemble existing Franc-produced BIOS kernel seed
        run: make -f stage4/Makefile.native native-seed
      - name: Assert UEFI handoff cannot overlap native kernel BSS
        shell: bash
        run: |
          set -euo pipefail
          end_hex=$(nm -n stage4/native_seed.elf | awk '$3=="__bss_end"{print $1}')
          test -n "$end_hex"
          test "$((16#$end_hex))" -le $((0x8f000))
          echo "PASS: kernel BSS ends at 0x$end_hex, before reserved GOP handoff"
      - name: Build C UEFI application and FAT ESP
        run: make -f stage4/uefi/Makefile esp
      - name: Confirm EFI image is PE32+ and not linked into kernel
        run: |
          file stage4/uefi/BOOTX64.EFI | grep -E 'PE32\+.*EFI'
          file stage4/native_seed.bin
      - name: Cold boot FrancOS through OVMF and capture real GOP pixels
        env:
          FRANC_UEFI_CAPTURE_DIR: stage4/uefi/screenshots
        run: python3 stage4/uefi/test_boot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: francos-uefi-gop-guest-screen
          path: stage4/uefi/screenshots/*.ppm
          if-no-files-found: warn
